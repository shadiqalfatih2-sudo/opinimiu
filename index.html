<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Opinimiu - Portal Opini Sulawesi Tengah">
  <title>Opinimiu - Portal Opini Sulteng</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #ffffff;
    }

    #opinimiu-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .loading-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ffffff;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      text-align: center;
      color: #1e3a5f;
    }

    .brand {
      margin: 0 0 18px;
      font-size: clamp(2rem, 7vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand span {
      color: #4a9fd8;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 16px;
      border: 4px solid #dbeafe;
      border-top-color: #4a9fd8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status {
      margin: 0;
      color: #64748b;
      font-size: 0.95rem;
    }

    .fallback {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      padding: 9px 13px;
      border: 1px solid #dbe3ec;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #1e3a5f;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.12);
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }

    .fallback:hover {
      background: #eff6ff;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.8s;
      }

      .loading-screen {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="loading-screen" class="loading-screen" aria-live="polite">
      <div class="loading-card">
        <h1 class="brand">Opini<span>miu</span></h1>
        <div class="spinner" aria-hidden="true"></div>
        <p class="status">Memuat Portal Opini Sulteng…</p>
      </div>
    </div>

    <iframe
      id="opinimiu-frame"
      title="Opinimiu - Portal Opini Sulteng"
      src="https://script.google.com/macros/s/AKfycbyQtokhRWwyPkMVYy8fr3BVhSrh4RRjzBS0sSMOWx3G2T2AZUzT-bYqLWceHQkdX9-E/exec"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <a
      class="fallback"
      href="https://script.google.com/macros/s/AKfycbyQtokhRWwyPkMVYy8fr3BVhSrh4RRjzBS0sSMOWx3G2T2AZUzT-bYqLWceHQkdX9-E/exec"
      target="_blank"
      rel="noopener noreferrer"
    >Buka langsung</a>
  </main>

  <script>
    const frame = document.getElementById('opinimiu-frame');
    const loadingScreen = document.getElementById('loading-screen');

    function hideLoading() {
      loadingScreen.classList.add('is-hidden');
    }

    frame.addEventListener('load', () => {
      window.setTimeout(hideLoading, 350);
    });

    // Pengaman agar layar pemuatan tidak terus tampil apabila event load terlambat.
    window.setTimeout(hideLoading, 8000);
  </script>
</body>
</html>
