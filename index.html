<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Opinimiu - Portal Opini Sulteng</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #ffffff;
      color: #1e3a5f;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #dbeafe;
      border-top-color: #4a9fd8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loading strong {
      font-size: 18px;
    }

    #loading span {
      max-width: 340px;
      padding: 0 20px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    #openDirect {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      padding: 10px 14px;
      border-radius: 999px;
      background: #1e3a5f;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }

    #openDirect:hover {
      background: #4a9fd8;
    }

    @media (max-width: 640px) {
      #openDirect {
        right: 10px;
        bottom: 10px;
        padding: 9px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="wrapper">
    <div id="loading">
      <div class="spinner"></div>
      <strong>Memuat Opinimiu...</strong>
      <span>Jika halaman tidak tampil, tekan tombol “Buka langsung”.</span>
    </div>

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyQtokhRWwyPkMVYy8fr3BVhSrh4RRjzBS0sSMOWx3G2T2AZUzT-bYqLWceHQkdX9-E/exec"
      title="Opinimiu - Portal Opini Sulteng"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <a
      id="openDirect"
      href="https://script.google.com/macros/s/AKfycbyQtokhRWwyPkMVYy8fr3BVhSrh4RRjzBS0sSMOWx3G2T2AZUzT-bYqLWceHQkdX9-E/exec"
      target="_blank"
      rel="noopener noreferrer">
      Buka langsung
    </a>
  </div>

  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function () {
      loading.classList.add("hide");
    });

    setTimeout(function () {
      loading.classList.add("hide");
    }, 8000);
  </script>
</body>
</html>
