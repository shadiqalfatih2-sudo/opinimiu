<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Opinimiu - Portal Opini Sulteng</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .app-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #fff;
      color: #1e3a5f;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dbeafe;
      border-top-color: #4a9fd8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading strong { font-size: 18px; }
    .loading small {
      color: #64748b;
      text-align: center;
      padding: 0 24px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
    .fallback {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 3;
    }
    .fallback a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: #1e3a5f;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .18);
    }
    .fallback a:hover { background: #4a9fd8; }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="loading" class="loading">
      <div class="spinner" aria-hidden="true"></div>
      <strong>Memuat Opinimiu...</strong>
      <small>Jika halaman tidak tampil, gunakan tombol “Buka langsung”.</small>
    </div>

    <iframe
      id="opinimiuFrame"
      src="https://script.google.com/macros/s/AKfycbyQtokhRWwyPkMVYy8fr3BVhSrh4RRjzBS0sSMOWx3G2T2AZUzT-bYqLWceHQkdX9-E/exec"
      title="Opinimiu - Portal Opini Sulteng"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager">
    </iframe>

    <div class="fallback">
      <a href="https://script.google.com/macros/s/AKfycbyQtokhRWwyPkMVYy8fr3BVhSrh4RRjzBS0sSMOWx3G2T2AZUzT-bYqLWceHQkdX9-E/exec" target="_blank" rel="noopener noreferrer">
        Buka langsung
      </a>
    </div>
  </main>

  <script>
    const frame = document.getElementById('opinimiuFrame');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', () => {
      loading.classList.add('hidden');
    });

    setTimeout(() => {
      loading.classList.add('hidden');
    }, 8000);
  </script>
</body>
</html>
